    <div class="container">

            <div class="col">

                        fw-<cms:show ccs_tpb_mnu_sc1_fw />
                        ls-<cms:show ccs_tpb_mnu_sc1_ls />

                        <cms:show ccs_tpb_sc1_link />
                        " <cms:if ccs_tpb_mnu_sc1_lnk_opt='ext' >target="_blank" </cms:if>

            </div>
            <div class="col-auto text-lg-end me-lg-n1 px-0 pe-lg-1">
                    <cms:if ccs_gl_edt_ok>
                        <div>
                            <cms:popup_edit 'ccs_nav_tpb_mnu_sc2_msg|ccs_nav_tpb_mnu_sc2_grp|ccs_tpb_mnu_sc2_txt_row|ccs_tpb_mnu_sc2_text|ccs_tpb_mnu_sc2_font|ccs_tpb_mnu_sc2_fw|ccs_tpb_mnu_sc2_fst|ccs_tpb_mnu_sc2_ls' link_text="<span class='bg-800 link-warning' title='Format text'>| [Format Text] |</span>" />
                            <cms:popup_edit 'ccs_tpb_mnu_sc2_rpt_msg|ccs_tpb_mnu_sc2_rpt' link_text="<span class='bg-800 link-warning' title='change links, icons'>| [Links] |</span>" />
                        </div>
                    </cms:if>
                <cms:show_repeatable 'ccs_tpb_mnu_sc2_rpt'>
                    <cms:if ccs_tpb_mnu_sc2_lnk_opt="ext" >
                        <cms:set ccs_tpb_sc2_link="<cms:show ccs_tpb_mnu_sc2_lnk_ext />" />

                    <cms:else_if ccs_tpb_mnu_sc2_lnk_opt="eml" />
                         <cms:set ccs_tpb_sc2_link="mailto:<cms:show ccs_tpb_mnu_sc2_lnk_ext />" />
                    <cms:else />
                         <cms:set ccs_tpb_sc2_link="<cms:show ccs_tpb_mnu_sc2_lnk_site />" />
                    </cms:if>
                    <a class="btn btn-link btn-xs pe-4 ps-0
                        link-<cms:show ccs_tpb_mnu_sc2_text />
                        font-<cms:show ccs_tpb_mnu_sc2_font />
                        fst-<cms:show ccs_tpb_mnu_sc2_fst />
                        fw-<cms:show ccs_tpb_mnu_sc2_fw />
                        ls-<cms:show ccs_tpb_mnu_sc2_ls />
                        " href="
                        <cms:show ccs_tpb_sc2_link />
                        " <cms:if ccs_tpb_mnu_sc2_lnk_opt='ext' >target="_blank" </cms:if>
                    >
                     <span class="<cms:show ccs_tpb_mnu_sc2_icn />" style="margin-right: 2px;"></span>
                        <span> <cms:show ccs_tpb_mnu_sc2_ttl /></span> 
                    </a>
                </cms:show_repeatable>
            </div>
        </div>
    </div>
</section>
