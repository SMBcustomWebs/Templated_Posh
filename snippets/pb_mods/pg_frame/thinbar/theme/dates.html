<section class="bg-100 py-2" id="book">

    <div class="container">
      <form method="POST" onsubmit="return false;">
        <div class="row">
          <div class="col-lg-3 col-md-6">
            <label for="check-in">Check-in Date</label>
            <input class="form-control" id="check-in" type="date" value="2017-07-11" />
          </div>
          <div class="col-lg-3 col-md-6">
            <label for="check-out">Check-out Date</label>
            <input class="form-control" id="check-out" type="date" value="2017-07-11" />
          </div>
          <div class="col-lg-3 col-md-6">
            <label for="guest">Guests</label>
            <input class="form-control" id="guest" type="number" value="1" min="1" />
          </div>
          <div class="col-lg-3 col-md-6">
            <label for="submit">&nbsp; </label>
            <input class="btn btn-warning d-block w-100" id="submit" type="submit" value="Check Acailability" />
          </div>
        </div>
      </form>
    </div>
    <!-- end of .container-->

  </section>
