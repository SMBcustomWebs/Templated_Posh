<cms:editable type='group' name='site_ftr_lnk_gen_stng_grp' label='2-Column with Logo Footer Settings'  order='20'>

        />

            order='7'
        />

            opt_selected='light'

            order='12'
        />
    </cms:editable>    
    <cms:editable type='row' name='site_ftr_lnk_frmt_row' order='10'>
        <cms:editable type='dropdown' name='site_ftr_lnk_txt_sz' label='Text Size (for more control over size)' 
            opt_values='dropdowns/text-size.htm'
            dynamic='opt_values'
            opt_selected='9'
            class='col-md-4 col-sm-6'
            order='16'  
        />
        <cms:editable type='dropdown' name='site_ftr_lnk_txt_fnt_wt' label='Font Weight'

            dynamic='opt_values'
            order='4'  
        />

            <cms:if site_ftr_pg_lnks_lnk_opt='custom'>
                show
            <cms:else />
                hide
            </cms:if>
        </cms:func>
        <cms:editable type='text' name='site_ftr_lnk_cstm_lnk' label='Custom Link'  desc='enter full url' not_active=site_ftr_lnk_lnks_lnk_cstm_chc

        />
