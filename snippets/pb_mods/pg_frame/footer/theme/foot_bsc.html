<cms:if ccs_ftr_bsc_lnks_lnk_opt='custom'>
    <cms:set ccs_ftr_bsc_lnks_link="<cms:show ccs_ftr_bsc_lnks_cstm_lnk />" />
<cms:else />
    <cms:set ccs_ftr_bsc_lnks_link="<cms:show ccs_ftr_bsc_lnks_lnk_opt />" />
</cms:if>
<footer class="
    py-<cms:show ccs_ftr_bsc_pad_y /> 
    bg-<cms:show ccs_ftr_bsc_bg_clr_opt /> 
">
    <cms:if ccs_gl_edt_ok>
        <cms:popup_edit  'ccs_ftr_bsc_gen_set_row|ccs_ftr_bsc_pad_y|ccs_ftr_bsc_bg_clr_opt' link_text="<div><span class='bg-800 link-warning' title='Edit general footer settings'>| [Background Color &amp; Height] |</span>" />
        <cms:popup_edit  'ccs_ftr_bsc_gen_set_row|ccs_ftr_bsc_text|ccs_ftr_bsc_fs|ccs_ftr_bsc_font|ccs_ftr_bsc_fwt|ccs_ftr_bsc_fst|ccs_ftr_bsc_ls' link_text="<span class='bg-800 link-warning' title='Edit general footer settings'>| [Format Text] |</span></div>" />
    </cms:if>
    <div class="container">
        <div class="row align-items-center justify-content-between">
            <div class=" col-auto
                link-<cms:show ccs_ftr_bsc_text />
                font-<cms:show ccs_ftr_bsc_font />
                fs-<cms:show ccs_ftr_bsc_fs /> 
                fst-<cms:show ccs_ftr_bsc_fst /> 
                fw-<cms:show ccs_ftr_bsc_fwt /> 
                ls-<cms:show ccs_ftr_bsc_ls /> 
            ">
                <cms:if "<cms:not_empty ccs_ftr_bsc_site_logo />" >
                    <img class="d-block-inline" src="<cms:show ccs_ftr_bsc_site_logo />" alt="<cms:show ccs_ftr_bsc_site_logo_alt />" style="max-width: 150px;" />
                </cms:if>
                &copy;
                <cms:date format='Y' /> 
                <cms:get_field  'ccs_gl_site_name' masterpage="globals.php" />
                <cms:if ccs_gl_edt_ok>
                    <cms:popup_edit  'ccs_ftr_bsc_site_logo|ccs_ftr_bsc_site_logo_alt' link_text="<div><span class='bg-800 link-warning' title='Edit logo'>| [EDIT Logo] |</span></div>" /> 
                </cms:if>
            </div>
            <div class="col-auto">
                <cms:show_repeatable  'ccs_ftr_bsc_lnks_rpt' >
                    <cms:if k_last_row>
                        <a class="
                            d-md-inline-block
                            link-<cms:show ccs_ftr_bsc_text />
                            font-<cms:show ccs_ftr_bsc_font />
                            fs-<cms:show ccs_ftr_bsc_fs /> 
                            fst-<cms:show ccs_ftr_bsc_fst /> 
                            fw-<cms:show ccs_ftr_bsc_fwt /> 
                            ls-<cms:show ccs_ftr_bsc_ls /> 
                            " href="<cm:show ccs_ftr_bsc_lnks_link /> 
                        ">
                            <cms:show ccs_ftr_bsc_lnks_ttl />  
                        </a>
                    <cms:else />
                        <a class="d-md-inline-block
                            link-<cms:show ccs_ftr_bsc_text />
                            font-<cms:show ccs_ftr_bsc_font />
                            fs-<cms:show ccs_ftr_bsc_fs /> 
                            fst-<cms:show ccs_ftr_bsc_fst /> 
                            fw-<cms:show ccs_ftr_bsc_fwt /> 
                            ls-<cms:show ccs_ftr_bsc_ls />                         
                            " href="<cm:show ccs_ftr_bsc_lnks_link /> 
                        ">
                            <cms:show ccs_ftr_bsc_lnks_ttl />  
                        </a>
                        |
                    </cms:if>
                </cms:show_repeatable>
                <cms:if ccs_gl_edt_ok>                  
                    <cms:popup_edit  'ccs_ftr_bsc_lnks_rpt' link_text="<div><span class='bg-800 link-warning' title='Edit Links'>| [EDIT Links] |</span></div>" /> 
                </cms:if>
            </div>
            <div class="col-auto">
                <cms:pages masterpage='globals.php'>
                    <cms:show_repeatable 'ccs_gl_social'>
                        <a class="p-2   link-<cms:show ccs_ftr_bsc_text />" href="<cms:show ccs_gl_social_link />" title="<cms:show ccs_gl_social_name />">
                            <span class="<cms:show ccs_gl_social_icon /> fs-<cms:show ccs_ftr_bsc_fs />" data-fa-transform="up-1" ></span>
                        </a>
                    </cms:show_repeatable>
                    <cms:if ccs_gl_edt_ok>
                        <cms:popup_edit 'ccs_gl_social' link_text="<div><span class='bg-800 link-warning' title='Edit social'>| [EDIT Socical] |</span></div>" />
                    </cms:if>
                </cms:pages>                
            </div>
        </div>
    </div>
</footer>
