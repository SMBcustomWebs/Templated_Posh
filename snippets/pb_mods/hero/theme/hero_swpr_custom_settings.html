<!--sets hero bg color -->
<cms:if hero_swpr_bg_clr_opt = 'custom' >
    <cms:set swpr_bg_clr="gradient" "global" />
<cms:else />
    <cms:set swpr_bg_clr="<cms:show hero_swpr_bg_clr_opt />" "global" />
</cms:if>
<!--sets hero ovrly color -->
<cms:if hero_swpr_ovrly_clr_opt = 'custom' >
    <cms:set swpr_ovrly_clr="gradient" "global" />
<cms:else />
    <cms:set swpr_ovrly_clr="<cms:show hero_swpr_ovrly_clr_opt />" "global" />
</cms:if>
<!--sets text box size if custom -->
<cms:if hero_swpr_txtbx_sz_opt='custom'>
    <cms:capture into='swpr_txtbx_size_cap' scope="global">
        <cms:show_repeatable 'hero_swpr_txtbx_cstm_sz_rpt'>
            col-<cms:show hero_swpr_txtbx_cstm_col_sz />-<cms:show hero_swpr_txtbx_cstm_col_val />
        </cms:show_repeatable>
    </cms:capture>
    <cms:set swpr_txtbx_size="<cms:show swpr_txtbx_size_cap />" />
<cms:else />
    <cms:set swpr_txtbx_size="col <cms:show hero_swpr_txtbx_sz_opt />" />
</cms:if>
